<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Ucapan & Doa</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        padding: 20px;
    }

    h1 {
        text-align: center;
    }

    #list {
        max-width: 600px;
        margin: 20px auto;
    }

    .card {
        background: #fff;
        padding: 15px;
        margin-bottom: 10px;
        border-radius: 8px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .nama {
        font-weight: bold;
        margin-bottom: 5px;
    }

    .ucapan {
        color: #555;
    }

    .loading {
        text-align: center;
        color: #888;
    }
</style>
</head>

<body>

<h1>💐 Ucapan & Doa 💐</h1>

<div id="list">
    <p class="loading">Memuat data...</p>
</div>

<script>
    // GANTI DENGAN URL CSV GOOGLE SHEETS ANDA
    const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSt5yjQM98JRqLxuTSNQAt11r9LjyWrmtyfFZNKG53ALNmy3H1xiCMilwGPwGUKG06YDbzGTFLtIadj/pub?gid=0&single=true&output=csv";

    fetch(SHEET_URL)
        .then(res => res.text())
        .then(csv => {
            const rows = csv.trim().split("\n").slice(1); // skip header
            const list = document.getElementById("list");
            list.innerHTML = "";

            if (rows.length === 0) {
                list.innerHTML = "<p class='loading'>Belum ada ucapan</p>";
                return;
            }

            rows.forEach(row => {
                const cols = row.split(",");
                const nama = cols[0] || "-";
                const ucapan = cols.slice(1).join(",") || "";

                const card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `
                    <div class="nama">${nama}</div>
                    <div class="ucapan">${ucapan}</div>
                `;
                list.appendChild(card);
            });
        })
        .catch(err => {
            document.getElementById("list").innerHTML =
                "<p class='loading'>Gagal memuat data</p>";
            console.error(err);
        });
</script>

</body>
</html>
